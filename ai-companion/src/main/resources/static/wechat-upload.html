<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>上传微信聊天记录</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:20px;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
    label{display:block;margin-top:12px}
    input[type=text]{font-size:16px;padding:8px;width:100%;max-width:400px}
    button{font-size:16px;padding:10px 20px}
    pre{font-size:13px;overflow-x:auto}
    @media(max-width:380px){body{margin:12px}h2{font-size:18px}}
  </style>
</head>
<body>
  <h2>上传微信聊天记录（HTML / 文本）</h2>
  <form id="uploadForm" enctype="multipart/form-data" method="post" action="/wechat/upload">
    <label>聊天文件：<input type="file" name="file" required></label>
    <label>会话 ID（可选，默认 wechat-upload）：<input type="text" name="sessionId"></label>
    <label>我的微信昵称（可选，用于区分谁是我）：<input type="text" name="ownerName"></label>
    <div style="margin-top:12px"><button type="submit">上传并分析</button></div>
  </form>
  <pre id="result" style="white-space:pre-wrap;margin-top:20px;border:1px solid #ddd;padding:12px;background:#f9f9f9"></pre>

  <script>
    const form = document.getElementById('uploadForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      result.textContent = '上传中...';
      try {
        const res = await fetch('/wechat/upload', {method:'POST', body:fd});
        const json = await res.json();
        result.textContent = JSON.stringify(json, null, 2);
      } catch (err) {
        result.textContent = '请求失败: ' + err;
      }
    });
  </script>
</body>
</html>
