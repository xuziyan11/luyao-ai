name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        # 测试用 H2 内存库，并在 @TestPropertySource 中注入占位密钥；
        # 仅 VOLCANO_TTS_APIKEY 无测试覆盖，这里给一个占位值让 Spring 上下文能正常加载。
        env:
          MYSQL_PASSWORD: ci-dummy
          COMPANION_PASSWORD: ci-dummy
          ADMIN_PASSWORD: ci-dummy
          DEEPSEEK_API_KEY: ci-dummy
          VOLCANO_TTS_APIKEY: ci-dummy
        run: |
          chmod +x mvnw
          ./mvnw -B test
